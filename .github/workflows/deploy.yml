name: Deploy ideaai.in

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy-ideaai
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/home/deploy-ideaai/ideaai-upload"
          rm: true
          overwrite: true

      - name: Publish website
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy-ideaai
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "Publishing ideaai.in"
            echo "========================================"

            rsync -rl --delete \
              --exclude='.git/' \
              /home/deploy-ideaai/ideaai-upload/ \
              /var/www/ideaai/

            rm -rf /home/deploy-ideaai/ideaai-upload

            echo "========================================"
            echo "ideaai.in deployment completed!"
            echo "========================================"