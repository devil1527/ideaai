name: Deploy ideaai.in

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy-ideaai
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "Starting ideaai.in deployment"
            echo "========================================"

            echo "Cleaning previous temporary deployment..."
            rm -rf /home/deploy-ideaai/site

            echo "Cloning latest main branch..."
            git clone \
              --depth 1 \
              --branch main \
              https://github.com/devil1527/ideaai.git \
              /home/deploy-ideaai/site

            echo "Deploying files to /var/www/ideaai..."

            rsync -rl --delete \
              --exclude='.git/' \
              /home/deploy-ideaai/site/ \
              /var/www/ideaai/

            echo "Cleaning temporary files..."
            rm -rf /home/deploy-ideaai/site

            echo "========================================"
            echo "Deployment completed successfully!"
            echo "========================================"